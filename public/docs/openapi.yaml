  '/api/v1/users/{user_id}/avatar/{version}/{size}':
    get:
      summary: 'Stream a user avatar'
      operationId: streamAUserAvatar
      description: "Stream a user's avatar (a given conversion) from the private media disk.\nResponds with the raw image bytes (not JSON); `{size}` is one of `thumb`,\n`small`, `medium`, or `original`, and `{version}` is an opaque\ncache-busting token.\n\nAvatars are not security-sensitive, so unlike other media they are served\nthrough this stable, authenticated endpoint instead of a short-lived\npresigned URL — the URL never expires, so clients (and any snapshot of it\nin presence/notifications) keep resolving. The {version} segment is an\nopaque cache-busting token (the media id); we always stream the user's\ncurrent avatar so frozen snapshot URLs survive an avatar change."
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Resource not found.'
                properties:
                  message:
                    type: string
                    example: 'Resource not found.'
      tags:
        - Users
    parameters:
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: version
        description: ''
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: size
        description: ''
        example: thumb|small|medium|original
        required: true
        schema:
          type: string
