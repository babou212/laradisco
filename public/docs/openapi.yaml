openapi: 3.0.3
info:
  title: 'Laradisco API Documentation'
  description: "Internal reference for the Laradisco HTTP API. The API follows the JSON:API standard (https://jsonapi.org) and is built on Laravel's native JSON:API resources."
  version: 1.0.0
servers:
  - url: 'http://localhost'
tags:
  - name: Service
    description: ''
  - name: Authentication
    description: ''
  - name: 'Channels & Messages'
    description: ''
  - name: Threads
    description: ''
  - name: Reactions
    description: ''
  - name: Pins
    description: ''
  - name: Typing
    description: ''
  - name: Voice
    description: ''
  - name: Soundboard
    description: ''
  - name: 'Direct Messages'
    description: 'Adds the reaction if absent (201) or removes it if present (200). `meta.added` indicates which happened.'
  - name: Presence
    description: ''
  - name: Notifications
    description: ''
  - name: Inbox
    description: ''
  - name: Mentions
    description: ''
  - name: Attachments
    description: ''
  - name: Users
    description: ''
  - name: 'Settings: Account'
    description: ''
  - name: 'Settings: Audit Log'
    description: ''
  - name: 'Settings: Categories'
    description: ''
  - name: 'Settings: Channels'
    description: ''
  - name: 'Settings: Invite Links'
    description: ''
  - name: 'Settings: Members'
    description: ''
  - name: 'Settings: Moderation'
    description: ''
  - name: 'Settings: Profile'
    description: ''
  - name: 'Settings: Roles'
    description: ''
  - name: 'Settings: Two-Factor'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token from <code>POST /api/v1/auth/login</code> (or <code>/auth/register</code>) and send it as <code>Authorization: Bearer &lt;token&gt;</code>.'
security:
  -
    default: []
paths:
  /api/v1/ping:
    get:
      summary: ''
      operationId: getApiV1Ping
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
                  app: Laradisco
                  reverb:
                    key: 83c67d4d66368a75a67528ac487dbc43
                    host: localhost
                    port: 8080
                    scheme: http
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string
                    example: Laradisco
                  reverb:
                    type: object
                    properties:
                      key:
                        type: string
                        example: 83c67d4d66368a75a67528ac487dbc43
                      host:
                        type: string
                        example: localhost
                      port:
                        type: integer
                        example: 8080
                      scheme:
                        type: string
                        example: http
      tags:
        - Service
  /api/v1/auth/login:
    post:
      summary: 'Log in'
      operationId: logIn
      description: "Issues a new API token. If the user has two-factor authentication enabled,\na challenge token is returned instead, requiring a second step\n(`/auth/two-factor-challenge`)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: success
                    type: object
                    example:
                      message: 'Authenticated successfully'
                      data:
                        token: 1|abcdef0123456789
                        user:
                          type: users
                          id: '7'
                          attributes:
                            username: ada
                            display_name: 'Ada Lovelace'
                            status: online
                    properties:
                      message:
                        type: string
                        example: 'Authenticated successfully'
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            example: 1|abcdef0123456789
                          user:
                            type: object
                            properties:
                              type:
                                type: string
                                example: users
                              id:
                                type: string
                                example: '7'
                              attributes:
                                type: object
                                properties:
                                  username:
                                    type: string
                                    example: ada
                                  display_name:
                                    type: string
                                    example: 'Ada Lovelace'
                                  status:
                                    type: string
                                    example: online
                  -
                    description: 'two-factor required'
                    type: object
                    example:
                      message: 'Two-factor authentication required'
                      data:
                        two_factor: true
                        challenge_token: a64characterrandomstring
                    properties:
                      message:
                        type: string
                        example: 'Two-factor authentication required'
                      data:
                        type: object
                        properties:
                          two_factor:
                            type: boolean
                            example: true
                          challenge_token:
                            type: string
                            example: a64characterrandomstring
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: '+-0pBNvYgxwmi/#iw'
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: u
              required:
                - email
                - password
                - device_name
      security: []
  /api/v1/auth/two-factor-challenge:
    post:
      summary: 'Complete two-factor challenge'
      operationId: completeTwoFactorChallenge
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\"message\": \"Authenticated successfully\", \"data\": {\"token\": \"1|abcdef0123456789\", \"user\": {\"type\": \"users\", \"id\": \"7\", \"attributes\": {\"username\": \"ada\", \"display_name\": \"Ada Lovelace\", \"status\": \"online\"}}}}\n\nVerify a two-factor authentication code and issue an API token."
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                  description: ''
                  example: architecto
                code:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                recovery_code:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
              required:
                - challenge_token
      security: []
  '/api/v1/auth/invite/{token}':
    get:
      summary: 'Validate an invite token'
      operationId: validateAnInviteToken
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    valid: true
                    expires_at: '2026-07-31T00:00:00.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                        example: true
                      expires_at:
                        type: string
                        example: '2026-07-31T00:00:00.000000Z'
        404:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\"errors\": [{\"status\": \"404\", \"title\": \"This invite link is invalid or has expired.\"}]}\n\nValidate an invite token without consuming it."
      tags:
        - Authentication
      security: []
    parameters:
      -
        in: path
        name: token
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/auth/register:
    post:
      summary: Register
      operationId: register
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\"message\": \"Authenticated successfully\", \"data\": {\"token\": \"1|abcdef0123456789\", \"user\": {\"type\": \"users\", \"id\": \"42\", \"attributes\": {\"username\": \"newbie\", \"display_name\": \"Newbie\", \"status\": \"online\"}}}}\n\nRegister a new user using a valid invite token."
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invite_token:
                  type: string
                  description: 'Must be 64 characters.'
                  example: bngzmiyvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbew
                username:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 255 characters.'
                  example: t
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: oking@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
              required:
                - invite_token
                - username
                - email
                - password
                - device_name
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Request a password reset code'
      operationId: requestAPasswordResetCode
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\"message\": \"If an account with that email exists, a reset code has been sent.\"}\n\nSend a password reset code to the user's email.\nGenerates a 6-digit code stored in cache for 15 minutes.\nDoes NOT modify the user's password."
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\"message\": \"Your password has been reset successfully. You can now sign in.\"}\n\nReset the user's password using a valid reset code."
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: gbailey@example.net
                code:
                  type: string
                  description: 'Must be 6 characters.'
                  example: miyvdl
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - code
                - password
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Get the current user'
      operationId: getTheCurrentUser
      description: 'Return the authenticated user, including their roles.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    type: users
                    id: '7'
                    attributes:
                      username: ada
                      display_name: 'Ada Lovelace'
                      email: ada@example.com
                      status: online
                      custom_status: null
                      created_at: '2026-01-01T00:00:00.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: users
                      id:
                        type: string
                        example: '7'
                      attributes:
                        type: object
                        properties:
                          username:
                            type: string
                            example: ada
                          display_name:
                            type: string
                            example: 'Ada Lovelace'
                          email:
                            type: string
                            example: ada@example.com
                          status:
                            type: string
                            example: online
                          custom_status:
                            type: string
                            example: null
                            nullable: true
                          created_at:
                            type: string
                            example: '2026-01-01T00:00:00.000000Z'
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      summary: 'Log out'
      operationId: logOut
      description: 'Revoke the current API token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logged out successfully'
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully'
      tags:
        - Authentication
  /api/v1/categories:
    get:
      summary: 'List sidebar categories'
      operationId: listSidebarCategories
      description: "Return the sidebar data: categories with their accessible channels. Each\nchannel is decorated with a per-user `has_unread` flag."
      parameters:
        -
          in: query
          name: include
          description: 'Comma-separated relations to embed. Allowed: channels.'
          example: channels
          required: false
          schema:
            type: string
            description: 'Comma-separated relations to embed. Allowed: channels.'
            example: channels
        -
          in: query
          name: sort
          description: 'Sort field; prefix - for descending. Allowed: position.'
          example: position
          required: false
          schema:
            type: string
            description: 'Sort field; prefix - for descending. Allowed: position.'
            example: position
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: categories
                      id: '3'
                      attributes:
                        name: 'Text Channels'
                        position: 0
                        created_at: '2026-06-30T12:00:00.000000Z'
                      relationships:
                        channels:
                          data:
                            -
                              type: channels
                              id: '42'
                  included:
                    -
                      type: channels
                      id: '42'
                      attributes:
                        name: general
                        channel_type: text
                        position: 0
                        has_unread: false
                properties:
                  data:
                    type: array
                    example:
                      -
                        type: categories
                        id: '3'
                        attributes:
                          name: 'Text Channels'
                          position: 0
                          created_at: '2026-06-30T12:00:00.000000Z'
                        relationships:
                          channels:
                            data:
                              - type: channels
                                id: '42'
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: categories
                        id:
                          type: string
                          example: '3'
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                              example: 'Text Channels'
                            position:
                              type: integer
                              example: 0
                            created_at:
                              type: string
                              example: '2026-06-30T12:00:00.000000Z'
                        relationships:
                          type: object
                          properties:
                            channels:
                              type: object
                              properties:
                                data:
                                  type: array
                                  example:
                                    - type: channels
                                      id: '42'
                                  items:
                                    type: object
                                    properties:
                                      type: { type: string, example: channels }
                                      id: { type: string, example: '42' }
                  included:
                    type: array
                    example:
                      -
                        type: channels
                        id: '42'
                        attributes:
                          name: general
                          channel_type: text
                          position: 0
                          has_unread: false
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: channels
                        id:
                          type: string
                          example: '42'
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                              example: general
                            channel_type:
                              type: string
                              example: text
                            position:
                              type: integer
                              example: 0
                            has_unread:
                              type: boolean
                              example: false
      tags:
        - 'Channels & Messages'
  /api/v1/members:
    get:
      summary: 'List server members'
      operationId: listServerMembers
      description: 'Get server members, cursor-paginated, with optional username search.'
      parameters:
        -
          in: query
          name: include
          description: 'Comma-separated relations to embed. Allowed: roles.'
          example: roles
          required: false
          schema:
            type: string
            description: 'Comma-separated relations to embed. Allowed: roles.'
            example: roles
        -
          in: query
          name: sort
          description: 'Sort field; prefix - for descending. Allowed: username.'
          example: username
          required: false
          schema:
            type: string
            description: 'Sort field; prefix - for descending. Allowed: username.'
            example: username
        -
          in: query
          name: 'filter[search]'
          description: 'Partial, case-insensitive match on username.'
          example: ali
          required: false
          schema:
            type: string
            description: 'Partial, case-insensitive match on username.'
            example: ali
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: users
                      id: '7'
                      attributes:
                        username: alice
                        display_name: Alice
                        avatar_urls: null
                        status: online
                        custom_status: null
                        created_at: '2026-06-30T12:00:00.000000Z'
                  links:
                    first: null
                    last: null
                    prev: null
                    next: null
                  meta:
                    path: ...
                    per_page: 50
                    next_cursor: null
                    prev_cursor: null
                properties:
                  data:
                    type: array
                    example:
                      -
                        type: users
                        id: '7'
                        attributes:
                          username: alice
                          display_name: Alice
                          avatar_urls: null
                          status: online
                          custom_status: null
                          created_at: '2026-06-30T12:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: users
                        id:
                          type: string
                          example: '7'
                        attributes:
                          type: object
                          properties:
                            username:
                              type: string
                              example: alice
                            display_name:
                              type: string
                              example: Alice
                            avatar_urls:
                              type: string
                              example: null
                              nullable: true
                            status:
                              type: string
                              example: online
                            custom_status:
                              type: string
                              example: null
                              nullable: true
                            created_at:
                              type: string
                              example: '2026-06-30T12:00:00.000000Z'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: null
                        nullable: true
                      last:
                        type: string
                        example: null
                        nullable: true
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      path:
                        type: string
                        example: ...
                      per_page:
                        type: integer
                        example: 50
                      next_cursor:
                        type: string
                        example: null
                        nullable: true
                      prev_cursor:
                        type: string
                        example: null
                        nullable: true
      tags:
        - 'Channels & Messages'
  '/api/v1/channels/{id}':
    get:
      summary: 'Show a channel'
      operationId: showAChannel
      description: "Get a single channel's details including the user's resolved permissions\nfor it (`channelPermissions`)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    type: channels
                    id: '42'
                    attributes:
                      name: general
                      topic: 'Company-wide chatter'
                      channel_type: text
                      is_private: false
                      category_id: 3
                      position: 0
                      slowmode_seconds: 0
                      channelPermissions:
                        canSendMessages: true
                        canManageMessages: false
                        canPinMessages: false
                        canAddReactions: true
                        canAttachFiles: true
                        canMentionEveryone: false
                      has_unread: false
                      created_at: '2026-06-30T12:00:00.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: channels
                      id:
                        type: string
                        example: '42'
                      attributes:
                        type: object
                        properties:
                          name:
                            type: string
                            example: general
                          topic:
                            type: string
                            example: 'Company-wide chatter'
                          channel_type:
                            type: string
                            example: text
                          is_private:
                            type: boolean
                            example: false
                          category_id:
                            type: integer
                            example: 3
                          position:
                            type: integer
                            example: 0
                          slowmode_seconds:
                            type: integer
                            example: 0
                          channelPermissions:
                            type: object
                            properties:
                              canSendMessages:
                                type: boolean
                                example: true
                              canManageMessages:
                                type: boolean
                                example: false
                              canPinMessages:
                                type: boolean
                                example: false
                              canAddReactions:
                                type: boolean
                                example: true
                              canAttachFiles:
                                type: boolean
                                example: true
                              canMentionEveryone:
                                type: boolean
                                example: false
                          has_unread:
                            type: boolean
                            example: false
                          created_at:
                            type: string
                            example: '2026-06-30T12:00:00.000000Z'
      tags:
        - 'Channels & Messages'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the channel.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/channels/{channel_id}/messages':
    get:
      summary: 'List channel messages'
      operationId: listChannelMessages
      description: "Returns messages oldest→newest. With no anchor, the latest `limit` messages\nare returned; otherwise anchor the window on `before`/`after`/`around` a\nmessage id. See the anchored-window scheme in docs/api/pagination.md."
      parameters:
        -
          in: query
          name: include
          description: 'Comma-separated relations to embed. Allowed: user, attachments, reactions, replyTo, replyTo.user, threadStarted, threadStarted.latestReply, threadStarted.latestReply.user, threadStarted.followers.'
          example: 'user,reactions'
          required: false
          schema:
            type: string
            description: 'Comma-separated relations to embed. Allowed: user, attachments, reactions, replyTo, replyTo.user, threadStarted, threadStarted.latestReply, threadStarted.latestReply.user, threadStarted.followers.'
            example: 'user,reactions'
        -
          in: query
          name: limit
          description: 'Page size, 1–100. Defaults to 20.'
          example: 20
          required: false
          schema:
            type: integer
            description: 'Page size, 1–100. Defaults to 20.'
            example: 20
        -
          in: query
          name: before
          description: 'Return messages older than this message id.'
          example: 1840
          required: false
          schema:
            type: integer
            description: 'Return messages older than this message id.'
            example: 1840
        -
          in: query
          name: after
          description: 'Return messages newer than this message id.'
          example: 1859
          required: false
          schema:
            type: integer
            description: 'Return messages newer than this message id.'
            example: 1859
        -
          in: query
          name: around
          description: 'Return a window centred on this message id.'
          example: 1850
          required: false
          schema:
            type: integer
            description: 'Return a window centred on this message id.'
            example: 1850
      responses:
        200:
          description: 'a window of messages'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: messages
                      id: '1858'
                      attributes:
                        channel_id: 42
                        user_id: 7
                        content: 'hey there'
                        is_pinned: false
                        is_edited: false
                        reply_to_id: null
                        thread_id: null
                        created_at: '2026-06-30T12:00:00.000000Z'
                      relationships:
                        user:
                          data:
                            type: users
                            id: '7'
                  meta:
                    has_more_before: true
                    has_more_after: false
                    oldest_id: '1858'
                    newest_id: '1858'
                properties:
                  data:
                    type: array
                    example:
                      -
                        type: messages
                        id: '1858'
                        attributes:
                          channel_id: 42
                          user_id: 7
                          content: 'hey there'
                          is_pinned: false
                          is_edited: false
                          reply_to_id: null
                          thread_id: null
                          created_at: '2026-06-30T12:00:00.000000Z'
                        relationships:
                          user:
                            data:
                              type: users
                              id: '7'
                    description: 'The messages, ordered oldest→newest.'
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: messages
                        id:
                          type: string
