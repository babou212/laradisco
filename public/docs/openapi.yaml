      operationId: showADMGroupWithMessages
      description: "Returns the DM group plus its messages oldest→newest. With no anchor, the\nlatest `limit` (default 50) messages are returned; otherwise anchor the\nwindow on `before`/`after`/`around` a message id. The group itself is in\n`meta.dm_group`."
