# Forge Nginx Configuration for LiveKit Subdomain
# Replace {{LIVEKIT_DOMAIN}} with your LiveKit subdomain (e.g., livekit.yourdomain.com)
#
# In Forge: create a new site for the LiveKit subdomain, then replace
# the Nginx config with this file. Enable Let's Encrypt for the subdomain.

server {
    listen 80;
    listen [::]:80;
    server_name {{LIVEKIT_DOMAIN}};

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {{LIVEKIT_DOMAIN}};
    server_tokens off;

    # SSL managed by Forge / Let's Encrypt
    ssl_certificate /etc/nginx/ssl/{{LIVEKIT_DOMAIN}}/server.crt;
    ssl_certificate_key /etc/nginx/ssl/{{LIVEKIT_DOMAIN}}/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Proxy all traffic to LiveKit server
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_pass http://127.0.0.1:7880;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    access_log off;
    error_log /var/log/nginx/{{LIVEKIT_DOMAIN}}-error.log error;
}
