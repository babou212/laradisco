# LiveKit Server Configuration for Laravel Forge
# Place this at /etc/livekit.yaml on the Forge server.
#
# Replace {{LIVEKIT_API_KEY}} and {{LIVEKIT_API_SECRET}} with your actual
# credentials (must match the values in your Laravel .env file).
# Replace {{SERVER_EXTERNAL_IP}} with the Hetzner server's public IP.

port: 7880

rtc:
  # Port range for WebRTC media (UDP primary, TCP fallback)
  port_range_start: 50000
  port_range_end: 60000
  # TCP fallback port for clients behind restrictive firewalls
  tcp_fallback_port: 7881
  # Use the server's external IP for ICE candidates
  use_external_ip: true

keys:
  {{LIVEKIT_API_KEY}}: {{LIVEKIT_API_SECRET}}

room:
  # Maximum participants per room
  max_participants: 50
  # Close empty rooms after 5 minutes
  empty_timeout: 300
  # Disconnect clients after 24 hours
  departure_timeout: 86400

# Embedded TURN server for NAT traversal
turn:
  enabled: true
  # Standard TURN port (UDP)
  udp_port: 3478
  # TLS TURN port (TCP) for restrictive firewalls
  tls_port: 5349
  # Use the same domain as your LiveKit subdomain
  domain: {{LIVEKIT_DOMAIN}}
  # Use the Let's Encrypt cert from Forge
  cert_file: /etc/nginx/ssl/{{LIVEKIT_DOMAIN}}/server.crt
  key_file: /etc/nginx/ssl/{{LIVEKIT_DOMAIN}}/server.key

logging:
  level: info
  # JSON format for structured logging
  json: true
