        -
          in: query
          name: include
          description: 'Comma-separated relations to embed. Allowed: user, reactions, replyTo, replyTo.user, attachments.'
          example: 'user,reactions'
          required: false
          schema:
            type: string
            description: 'Comma-separated relations to embed. Allowed: user, reactions, replyTo, replyTo.user, attachments.'
            example: 'user,reactions'
        -
          in: query
          name: limit
          description: 'Page size, 1–100. Defaults to 50.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Page size, 1–100. Defaults to 50.'
            example: 50
        -
          in: query
          name: before
          description: 'Return messages older than this message id.'
          example: 540
          required: false
          schema:
            type: integer
            description: 'Return messages older than this message id.'
            example: 540
        -
          in: query
          name: after
          description: 'Return messages newer than this message id.'
          example: 559
          required: false
          schema:
            type: integer
            description: 'Return messages newer than this message id.'
            example: 559
        -
          in: query
          name: around
          description: 'Return a window centred on this message id.'
          example: 550
          required: false
          schema:
            type: integer
            description: 'Return a window centred on this message id.'
            example: 550
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: direct_messages
                      id: '558'
                      attributes:
                        dm_group_id: 12
                        user_id: 8
                        content: 'hey there'
                        reply_to_id: null
                        is_pinned: false
                        is_edited: false
                        created_at: '2026-06-30T12:00:00.000000Z'
                      relationships:
                        user:
                          data:
                            type: users
                            id: '8'
                  meta:
                    has_more_before: true
                    has_more_after: false
                    oldest_id: '558'
                    newest_id: '558'
                properties:
                  data:
                    type: array
                    example:
                      -
                        type: direct_messages
                        id: '558'
                        attributes:
                          dm_group_id: 12
                          user_id: 8
                          content: 'hey there'
                          reply_to_id: null
                          is_pinned: false
                          is_edited: false
                          created_at: '2026-06-30T12:00:00.000000Z'
                        relationships:
                          user:
                            data:
                              type: users
                              id: '8'
                    description: 'The messages, ordered oldest→newest.'
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: direct_messages
                        id:
                          type: string
                          example: '558'
                        attributes:
                          type: object
                          properties:
                            dm_group_id:
                              type: integer
                              example: 12
                            user_id:
                              type: integer
                              example: 8
                            content:
                              type: string
                              example: 'hey there'
                            reply_to_id:
                              type: string
                              example: null
                              nullable: true
                            is_pinned:
                              type: boolean
                              example: false
                            is_edited:
                              type: boolean
                              example: false
                            created_at:
                              type: string
                              example: '2026-06-30T12:00:00.000000Z'
                        relationships:
