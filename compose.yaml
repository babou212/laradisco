services:
    laravel.test:
        build:
            context: .
            dockerfile: docker/Dockerfile.frankenphp
        image: laradisco-frankenphp/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:8080'
        command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080 --watch
        environment:
            AUTORUN_ENABLED: 'false'
            PHP_OPCACHE_ENABLE: '0'
            PHP_POST_MAX_SIZE: '120M'
            PHP_UPLOAD_MAX_FILESIZE: '110M'
            OCTANE_SERVER: frankenphp
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            PUID: '${WWWUSER:-1000}'
            PGID: '${WWWGROUP:-1000}'
        volumes:
            - '.:/var/www/html'
            - './docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            reverb:
                condition: service_started
            livekit:
                condition: service_started
            mailpit:
                condition: service_started
            meilisearch:
                condition: service_started
            garage-init:
                condition: service_completed_successfully
    queue:
        build:
            context: .
            dockerfile: docker/Dockerfile.frankenphp
        image: laradisco-frankenphp/app
        environment:
            AUTORUN_ENABLED: 'false'
            PUID: '${WWWUSER:-1000}'
            PGID: '${WWWGROUP:-1000}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            meilisearch:
                condition: service_started
            garage-init:
                condition: service_completed_successfully
        command: php artisan horizon
        restart: unless-stopped
    reverb:
        build:
            context: .
            dockerfile: docker/Dockerfile.frankenphp
        image: laradisco-frankenphp/app
        ports:
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        environment:
            AUTORUN_ENABLED: 'false'
            PUID: '${WWWUSER:-1000}'
            PGID: '${WWWGROUP:-1000}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            redis:
                condition: service_healthy
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 3s
            start_period: 5s
            retries: 5
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    meilisearch:
        image: 'getmeili/meilisearch:v1.35.1'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_MASTER_KEY: '${MEILISEARCH_KEY:-masterKeyForLocalDev}'
            MEILI_ENV: '${MEILI_ENV:-development}'
            MEILI_NO_ANALYTICS: 'true'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        restart: unless-stopped
    livekit:
        image: 'livekit/livekit-server:latest'
        ports:
            - '${FORWARD_LIVEKIT_PORT:-7880}:7880'
            - '${FORWARD_LIVEKIT_TCP_PORT:-7881}:7881'
            - '${FORWARD_LIVEKIT_UDP_PORT:-7882}:7882/udp'
        environment:
            LIVEKIT_CONFIG: |
                keys:
                  ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}
                webhook:
                  api_key: ${LIVEKIT_API_KEY:-devkey}
                  urls:
                    - http://laravel.test:8080/api/v1/livekit/webhook
        command: --dev --bind 0.0.0.0
        networks:
            - sail
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            interval: 3s
            start_period: 5s
            retries: 5
            timeout: 5s
    garage:
        image: 'dxflrs/garage:v1.0.1'
        ports:
            - '${FORWARD_GARAGE_PORT:-3900}:3900'
            - '${FORWARD_GARAGE_ADMIN_PORT:-3903}:3903'
        volumes:
            - './docker/garage.toml:/etc/garage.toml:ro'
            - 'sail-garage-meta:/var/lib/garage/meta'
            - 'sail-garage-data:/var/lib/garage/data'
        networks:
            - sail
        restart: unless-stopped
    garage-init:
        build:
            context: ./docker
            dockerfile: Dockerfile.garage-init
        image: laradisco-garage-init/app
        environment:
            GARAGE_BUCKET: 'laradisco'
            GARAGE_KEY_ID: 'GK3d1f0c9a8b7e6d5c4b3a2f10'
            GARAGE_KEY_SECRET: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
        volumes:
            - './docker/garage.toml:/etc/garage.toml:ro'
            - 'sail-garage-meta:/var/lib/garage/meta'
        networks:
            - sail
        depends_on:
            garage:
                condition: service_started
        restart: 'no'
networks:
    sail:
        driver: bridge
volumes:
    sail-redis:
        driver: local
    sail-pgsql:
        driver: local
    sail-meilisearch:
        driver: local
    sail-garage-meta:
        driver: local
    sail-garage-data:
        driver: local

