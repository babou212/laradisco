name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-app:
    name: Build laradisco (app)
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.meta.outputs.build_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute build tag
        id: meta
        run: |
          ts=$(date -u +%s)
          short=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "build_tag=${ts}-${short}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push app
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/babou212/laradisco:latest
            ghcr.io/babou212/laradisco:${{ github.sha }}
            ghcr.io/babou212/laradisco:${{ steps.meta.outputs.build_tag }}
          cache-from: type=gha,scope=laradisco-app
          cache-to: type=gha,mode=max,scope=laradisco-app

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign app image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "ref=${{ github.ref }}" \
            -a "sha=${{ github.sha }}" \
            -a "run_id=${{ github.run_id }}" \
            "ghcr.io/babou212/laradisco@${DIGEST}"

  build-derivatives:
    name: Build ${{ matrix.image }}
    needs: build-app
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: laradisco-worker
            dockerfile: Dockerfile.worker
          - image: laradisco-reverb
            dockerfile: Dockerfile.reverb
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/babou212/laradisco:${{ github.sha }}
          tags: |
            ghcr.io/babou212/${{ matrix.image }}:latest
            ghcr.io/babou212/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/babou212/${{ matrix.image }}:${{ needs.build-app.outputs.build_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign ${{ matrix.image }} (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "ref=${{ github.ref }}" \
            -a "sha=${{ github.sha }}" \
            -a "run_id=${{ github.run_id }}" \
            "ghcr.io/babou212/${{ matrix.image }}@${DIGEST}"
