[PHP]
; =============================================================================
; Production PHP overrides for serversideup/docker-php
; Settings managed by serversideup env vars (PHP_MEMORY_LIMIT, PHP_OPCACHE_ENABLE,
; PHP_MAX_EXECUTION_TIME, etc.) are NOT duplicated here.
; =============================================================================

; Logging
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/log/php/error.log

; Upload limits (supplement the env-var-managed ones)
max_file_uploads = 20
max_input_time = 60

; OPcache tuning (beyond what the env vars cover)
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
opcache.enable_file_override = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; Preloading - compiles framework into shared memory across all workers
opcache.preload = /var/www/html/preload.php
opcache.preload_user = www-data

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Realpath cache
realpath_cache_size = 4096k
realpath_cache_ttl = 600
